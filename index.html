<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informativo de KPIs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- ?v= força o navegador a baixar de novo: o Pages guarda CSS/JS em cache por 10 min. Suba a versão a cada mudança. -->
  <link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
  <header class="topo">
    <div class="conteudo topo__linha">
      <img class="topo__logo" src="assets/logo-infracommerce.svg" alt="Infracommerce" width="107" height="40">
      <p class="topo__tagline">Informativo de KPIs</p>
      <p class="pilula" id="atualizacao">Carregando…</p>
    </div>
  </header>

  <div class="aviso-exemplo" id="aviso-exemplo" hidden>
    <div class="conteudo">Dados de exemplo — o arquivo real (<code>data/kpis.json</code>) ainda não foi gerado.</div>
  </div>

  <main class="conteudo">
    <section class="hero">
      <h1 class="hero__titulo">Indicadores do mês<br><span class="hero__destaque">vendas, estoque e entregas</span></h1>
      <p class="hero__texto" id="periodo"></p>
    </section>

    <section class="filtros" aria-label="Filtros">
      <label class="filtro">
        <span class="filtro__rotulo">Loja</span>
        <select id="seletor-loja" class="filtro__controle"></select>
      </label>
      <div class="filtro" role="group" aria-labelledby="rotulo-meta">
        <span class="filtro__rotulo" id="rotulo-meta">Meta</span>
        <div class="alternador">
          <button type="button" class="alternador__opcao" data-meta="forecast" aria-pressed="true">Forecast</button>
          <button type="button" class="alternador__opcao" data-meta="budget" aria-pressed="false">Budget</button>
        </div>
      </div>
    </section>

    <div id="secoes"></div>
  </main>

  <footer class="rodape">
    <div class="conteudo">Fonte: BigQuery · mesmas regras dos dashboards de Power BI · comparativo: mês corrente até D-1 vs mesmo período do mês anterior</div>
  </footer>

  <script src="assets/app.js?v=4"></script>
</body>
</html>
